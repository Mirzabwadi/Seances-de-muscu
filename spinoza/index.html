<!doctype html>
<html lang="kab" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0a09;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .bg {
        position: absolute;
        left: -54px;
        top: -96px;
        width: 1188px;
        height: 2112px;
        object-fit: cover;
        z-index: 0;
      }
      #intro,
      #outro {
        z-index: 2;
      }
      #overlay {
        z-index: 3;
      }
      #captions {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="171.1"
      data-width="1080"
      data-height="1920"
    >
      <!-- One picture per idea of the narration; times come from assets/lines.json. -->
      <img id="bg-1" class="bg clip" src="assets/images/bg-portrait.jpg" alt="" data-start="4.6" data-duration="21.3" data-track-index="1" />
      <img id="bg-2" class="bg clip" src="assets/images/bg-ciel.jpg" alt="" data-start="25.9" data-duration="16.1" data-track-index="2" />
      <img id="bg-3" class="bg clip" src="assets/images/bg-mer.jpg" alt="" data-start="42" data-duration="12.7" data-track-index="1" />
      <img id="bg-4" class="bg clip" src="assets/images/bg-causes.jpg" alt="" data-start="54.7" data-duration="13" data-track-index="2" />
      <img id="bg-5" class="bg clip" src="assets/images/bg-pierre.jpg" alt="" data-start="67.7" data-duration="19.5" data-track-index="1" />
      <img id="bg-6" class="bg clip" src="assets/images/bg-paysage.jpg" alt="" data-start="87.2" data-duration="21.5" data-track-index="2" />
      <img id="bg-7" class="bg clip" src="assets/images/bg-tempete.jpg" alt="" data-start="108.7" data-duration="24.4" data-track-index="1" />
      <img id="bg-8" class="bg clip" src="assets/images/bg-lumiere.jpg" alt="" data-start="133.1" data-duration="17.3" data-track-index="2" />
      <img id="bg-9" class="bg clip" src="assets/images/bg-poussiere.jpg" alt="" data-start="150.4" data-duration="14.2" data-track-index="1" />

      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="5.1"
        data-track-kind="graphics"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="overlay"
        data-composition-id="overlay"
        data-composition-src="compositions/overlay.html"
        data-start="0"
        data-duration="164.6"
        data-track-kind="graphics"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="164.6"
        data-duration="6.5"
        data-track-kind="graphics"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="165.4"
        data-track-kind="captions"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="voice" class="clip" src="assets/audio/voice.m4a" data-start="0" data-duration="165.6" data-volume="1" data-track-index="6"></audio>
      <audio id="boom" class="clip" src="assets/audio/boom.mp3" data-start="0" data-duration="3" data-volume="0.5" data-track-index="7"></audio>
      <audio id="whoosh1" class="clip" src="assets/audio/whoosh.mp3" data-start="11.9" data-duration="0.73" data-volume="0.3" data-track-index="8"></audio>
      <audio id="whoosh2" class="clip" src="assets/audio/whoosh.mp3" data-start="54.4" data-duration="0.73" data-volume="0.3" data-track-index="9"></audio>
      <audio id="whoosh3" class="clip" src="assets/audio/whoosh.mp3" data-start="86.9" data-duration="0.73" data-volume="0.3" data-track-index="10"></audio>
      <audio id="whoosh4" class="clip" src="assets/audio/whoosh.mp3" data-start="132.8" data-duration="0.73" data-volume="0.3" data-track-index="11"></audio>
      <audio
        id="music"
        class="clip"
        src="assets/audio/music.mp3"
        data-start="0"
        data-duration="171.1"
        data-volume="1"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.3},{&quot;t&quot;:4.6,&quot;v&quot;:0.3},{&quot;t&quot;:5.2,&quot;v&quot;:0.16},{&quot;t&quot;:164.3,&quot;v&quot;:0.16},{&quot;t&quot;:165.1,&quot;v&quot;:0.5},{&quot;t&quot;:171.1,&quot;v&quot;:0.5}]}]}"
        data-track-index="12"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Each picture fades in over the previous one, then drifts slowly; the direction
      // alternates so two consecutive shots never move the same way.
      for (const [id, start, dur, from, to] of [
        ["#bg-1", 4.6, 21.3, 1.0, 1.08],
        ["#bg-2", 25.9, 16.1, 1.08, 1.0],
        ["#bg-3", 42, 12.7, 1.0, 1.08],
        ["#bg-4", 54.7, 13, 1.08, 1.0],
        ["#bg-5", 67.7, 19.5, 1.0, 1.08],
        ["#bg-6", 87.2, 21.5, 1.08, 1.0],
        ["#bg-7", 108.7, 24.4, 1.0, 1.08],
        ["#bg-8", 133.1, 17.3, 1.08, 1.0],
        ["#bg-9", 150.4, 14.2, 1.0, 1.08],
      ]) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, start);
        tl.fromTo(id, { scale: from }, { scale: to, duration: dur, ease: "none", immediateRender: false }, start);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
