<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0e10;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .bg {
        position: absolute;
        left: -54px;
        top: -96px;
        width: 1188px;
        height: 2112px;
        object-fit: cover;
        z-index: 0;
      }
      #intro,
      #outro {
        z-index: 2;
      }
      #titles {
        z-index: 3;
      }
      #captions {
        z-index: 4;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="38"
      data-width="1080"
      data-height="1920"
    >
      <!-- Voice-over Reel: the paintings are the picture, one per part of the story. -->
      <img id="bg-ecole" class="bg clip" src="assets/images/bg-ecole-athenes.jpg" alt="" data-start="3.9" data-duration="4.3" data-track-index="1" />
      <img id="bg-poussin" class="bg clip" src="assets/images/bg-diogene-poussin.jpg" alt="" data-start="8.2" data-duration="8.9" data-track-index="2" />
      <img id="bg-lanterne" class="bg clip" src="assets/images/bg-diogene-gerome.jpg" alt="" data-start="17.1" data-duration="7.1" data-track-index="1" />
      <img id="bg-soleil" class="bg clip" src="assets/images/bg-gerome-soleil.jpg" alt="" data-start="24.2" data-duration="7.7" data-track-index="2" />

      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="4.3"
        data-track-kind="graphics"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="31.9"
        data-track-kind="graphics"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="31.9"
        data-duration="6.1"
        data-track-kind="graphics"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0.3"
        data-duration="34.4"
        data-track-kind="captions"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="voice" class="clip" src="assets/audio/voice.m4a" data-start="0.3" data-duration="34.1" data-volume="1" data-track-index="6"></audio>
      <audio id="boom" class="clip" src="assets/audio/boom.mp3" data-start="0" data-duration="3" data-volume="0.6" data-track-index="7"></audio>
      <audio
        id="music"
        class="clip"
        src="assets/audio/music.mp3"
        data-start="0"
        data-duration="38"
        data-volume="1"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.18},{&quot;t&quot;:34.3,&quot;v&quot;:0.18},{&quot;t&quot;:35,&quot;v&quot;:0.5},{&quot;t&quot;:38,&quot;v&quot;:0.5}]}]}"
        data-track-index="8"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Each painting fades in over the previous one, then drifts slowly (alternating
      // push-in and pull-out so consecutive shots don't move the same way).
      for (const [id, start, dur, from, to] of [
        ["#bg-ecole", 3.9, 4.3, 1.0, 1.08],
        ["#bg-poussin", 8.2, 8.9, 1.1, 1.0],
        ["#bg-lanterne", 17.1, 7.1, 1.0, 1.1],
        ["#bg-soleil", 24.2, 7.7, 1.08, 1.0],
      ]) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, start);
        tl.fromTo(id, { scale: from }, { scale: to, duration: dur, ease: "none", immediateRender: false }, start);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
