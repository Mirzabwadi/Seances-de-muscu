<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0e10;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      #cam-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 42%;
      }
      #cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #titles,
      #captions {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="56.7"
      data-width="1080"
      data-height="1920"
    >
      <div id="cam-wrap">
        <video
          id="cam"
          class="clip"
          src="assets/socrate.mp4"
          data-start="0"
          data-duration="56.7"
          data-has-audio="true"
          data-track-index="0"
        ></video>
      </div>
      <audio
        id="music"
        class="clip"
        src="assets/audio/music.mp3"
        data-start="0"
        data-duration="56.7"
        data-volume="1"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.16},{&quot;t&quot;:55.1,&quot;v&quot;:0.16},{&quot;t&quot;:55.6,&quot;v&quot;:0.45},{&quot;t&quot;:56.7,&quot;v&quot;:0.45}]}]}"
        data-track-index="3"
      ></audio>
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="0"
        data-duration="56.7"
        data-track-kind="graphics"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="56.7"
        data-track-kind="captions"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // One framing per take: alternating the zoom at each cut hides the jump cuts.
      const takes = [
        [0, 4.5, 1.0, 1.05],
        [4.5, 9.2, 1.12, 1.14],
        [9.2, 25.05, 1.0, 1.06],
        [25.05, 27.15, 1.16, 1.17],
        [27.15, 43.3, 1.0, 1.06],
        [43.3, 45.15, 1.15, 1.18],
        [45.15, 47.5, 1.0, 1.02],
        [47.5, 50.8, 1.12, 1.16],
        [50.8, 56.7, 1.18, 1.24],
      ];
      for (const [start, end, from, to] of takes) {
        tl.fromTo("#cam-wrap", { scale: from }, { scale: to, duration: end - start, ease: "none", immediateRender: false }, start);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
