<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0e0e10;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ground);
      }
      .bg {
        position: absolute;
        left: -54px;
        top: -96px;
        width: 1188px;
        height: 2112px;
        object-fit: cover;
        z-index: 0;
      }
      #cam-wrap {
        position: absolute;
        inset: 0;
        z-index: 1;
        transform-origin: 50% 42%;
      }
      #cam {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #titles,
      #captions {
        z-index: 2;
      }
      #intro,
      #outro {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="63.1"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="3.5"
        data-track-kind="graphics"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Antiquity behind the speaker, one picture per part of the story. -->
      <img id="bg-acropole" class="bg clip" src="assets/images/bg-acropole.jpg" alt="" data-start="3.5" data-duration="9.2" data-track-index="1" />
      <img id="bg-ecole" class="bg clip" src="assets/images/bg-ecole-athenes.jpg" alt="" data-start="12.7" data-duration="20.1" data-track-index="2" />
      <img id="bg-mort" class="bg clip" src="assets/images/bg-mort-de-socrate.jpg" alt="" data-start="32.8" data-duration="15.85" data-track-index="1" />
      <img id="bg-mosaique" class="bg clip" src="assets/images/bg-mosaique-academie.jpg" alt="" data-start="48.65" data-duration="10.25" data-track-index="2" />

      <div id="cam-wrap">
        <video
          id="cam"
          class="clip"
          src="assets/socrate-cutout.webm"
          muted
          data-start="3.5"
          data-duration="55.4"
          data-layout-allow-occlusion
          data-track-index="3"
        ></video>
      </div>
      <div
        id="titles"
        data-composition-id="titles"
        data-composition-src="compositions/titles.html"
        data-start="3.5"
        data-duration="55.4"
        data-track-kind="graphics"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="3.5"
        data-duration="55.4"
        data-track-kind="captions"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="outro"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="58.9"
        data-duration="4.2"
        data-track-kind="graphics"
        data-track-index="6"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio id="voice" class="clip" src="assets/audio/voice.m4a" data-start="3.5" data-duration="55.4" data-volume="1" data-track-index="7"></audio>
      <audio id="boom" class="clip" src="assets/audio/boom.mp3" data-start="0" data-duration="3" data-volume="0.8" data-track-index="8"></audio>
      <audio
        id="music"
        class="clip"
        src="assets/audio/music.mp3"
        data-start="0"
        data-duration="63.1"
        data-volume="1"
        data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0.55},{&quot;t&quot;:3.2,&quot;v&quot;:0.55},{&quot;t&quot;:3.7,&quot;v&quot;:0.16},{&quot;t&quot;:58.6,&quot;v&quot;:0.16},{&quot;t&quot;:59.3,&quot;v&quot;:0.5},{&quot;t&quot;:63.1,&quot;v&quot;:0.5}]}]}"
        data-track-index="9"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const T0 = 3.5; // the talk starts after the opening titles

      // Backgrounds: fade in over the previous one, then a slow drift.
      for (const [id, start, dur] of [
        ["#bg-acropole", 3.5, 9.2],
        ["#bg-ecole", 12.7, 20.1],
        ["#bg-mort", 32.8, 15.85],
        ["#bg-mosaique", 48.65, 10.25],
      ]) {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, start);
        tl.fromTo(id, { scale: 1.0 }, { scale: 1.07, duration: dur, ease: "none", immediateRender: false }, start);
      }

      // One framing per take: alternating the zoom at each cut hides the jump cuts.
      const takes = [
        [0, 4.5, 1.0, 1.05],
        [4.5, 9.2, 1.12, 1.14],
        [9.2, 25.05, 1.0, 1.06],
        [25.05, 27.15, 1.16, 1.17],
        [27.15, 43.3, 1.0, 1.06],
        [43.3, 45.15, 1.15, 1.18],
        [45.15, 47.5, 1.0, 1.02],
        [47.5, 50.8, 1.12, 1.16],
        [50.8, 55.4, 1.18, 1.24],
      ];
      for (const [start, end, from, to] of takes) {
        tl.fromTo("#cam-wrap", { scale: from }, { scale: to, duration: end - start, ease: "none", immediateRender: false }, T0 + start);
      }
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
